<!DOCTYPE html>
<html>
<head>

    <title>Car Workshop</title>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

    <style>

        body {
            text-align: center;
            font-family: Arial;
        }

        #car {
            position: relative;
            width: 300px;
            height: 150px;
            margin: 50px auto;
        }

        #body {
            position: absolute;
            width: 260px;
            height: 70px;
            background-color: green;
            left: 20px;
            top: 40px;
        }

        #glass {
            position: absolute;
            width: 100px;
            height: 40px;
            background-color: lightblue;
            left: 90px;
            top: 5px;
        }

        .tyre {
            position: absolute;
            width: 45px;
            height: 45px;
            background-color: black;
            border-radius: 50%;
            top: 95px;
        }

        #tyre1 {
            left: 50px;
        }

        #tyre2 {
            right: 50px;
        }

        button {
            margin: 10px;
            padding: 8px;
        }

    </style>

    <script>

        $(document).ready(function() {

            $("#bodyColor").click(function() {
                $("#body").css("background-color", "red");
            });

            $("#glassColor").click(function() {
                $("#glass").css("background-color", "black");
            });

            $("#bigTyre").click(function() {
                $(".tyre").css({
                    "width": "60px",
                    "height": "60px"
                });
            });

            $("#smallTyre").click(function() {
                $(".tyre").css({
                    "width": "35px",
                    "height": "35px"
                });
            });

            $("#reset").click(function() {

                $("#body").css("background-color", "green");

                $("#glass").css("background-color", "lightblue");

                $(".tyre").css({
                    "width": "45px",
                    "height": "45px"
                });

            });

        });

    </script>

</head>

<body>

    <h2>Car Workshop</h2>

    <div id="car">

        <div id="glass"></div>

        <div id="body"></div>

        <div id="tyre1" class="tyre"></div>

        <div id="tyre2" class="tyre"></div>

    </div>

    <button id="bodyColor">Change Car Color</button>

    <button id="glassColor">Change Body Glass</button>

    <button id="bigTyre">Tyre Size Increase</button>

    <button id="smallTyre">Tyre Size Decrease</button>

    <button id="reset">Reset</button>

</body>
</html>
