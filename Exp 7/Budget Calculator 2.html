<!DOCTYPE html>
<html>
<head>
    <title>Budget Calculator</title>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

    <style>
        body {
            font-family: Arial;
            text-align: center;
        }

        h2 {
            background-color: black;
            color: white;
            padding: 10px;
        }

        input {
            width: 80px;
            margin: 5px;
        }

        button {
            background-color: blue;
            color: white;
            padding: 8px 20px;
            border: none;
        }

        .box {
            display: inline-block;
            margin: 15px;
            padding: 15px;
            color: white;
        }
    </style>

    <script>
        $(document).ready(function() {

            $("#evaluate").click(function() {

                let amount = parseInt($("#amount").val());

                let rent = parseInt($("#rent").val());
                let accessories = parseInt($("#accessories").val());
                let emergency = parseInt($("#emergency").val());
                let saving = parseInt($("#saving").val());

                let total = rent + accessories + emergency + saving;

                if (total != 100) {
                    alert("Percentage should be 100%");
                }
                else {

                    $("#rentResult").html("Room Rent<br>Rs." + (amount * rent / 100));

                    $("#accessoryResult").html("Accessories<br>Rs." + (amount * accessories / 100));

                    $("#emergencyResult").html("Emergency<br>Rs." + (amount * emergency / 100));

                    $("#savingResult").html("Saving<br>Rs." + (amount * saving / 100));
                }
            });

        });
    </script>
</head>

<body>

    <h2>Budget Calculator App</h2>

    <p>Enter Amount that you want to Manage</p>

    <input type="text" id="amount" value="15000">

    <p>How would you like to divide your money?</p>

    Room Rent(%):
    <input type="text" id="rent" value="50">

    Accessories(%):
    <input type="text" id="accessories" value="20">

    Emergency(%):
    <input type="text" id="emergency" value="20">

    Saving(%):
    <input type="text" id="saving" value="10">

    <br><br>

    <button id="evaluate">Evaluate My Money</button>

    <br><br>

    <div id="rentResult" class="box" style="background-color:blue;"></div>

    <div id="accessoryResult" class="box" style="background-color:green;"></div>

    <div id="emergencyResult" class="box" style="background-color:blue;"></div>

    <div id="savingResult" class="box" style="background-color:pink;"></div>

</body>
</html>
